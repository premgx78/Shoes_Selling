<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful — SneakPeak</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'DM Sans',sans-serif; background:#f9fafb; display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .card { background:#fff; border-radius:20px; padding:3rem 2.5rem; max-width:440px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.1); }
        .icon { font-size:4rem; color:#10b981; margin-bottom:1.5rem; }
        h1 { font-family:'Syne',sans-serif; font-size:1.8rem; font-weight:800; color:#0f172a; margin-bottom:0.75rem; }
        p { color:#6b7280; line-height:1.6; margin-bottom:1.5rem; }
        .order-id { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:1rem; margin-bottom:1.5rem; }
        .order-id strong { color:#065f46; font-size:1.1rem; }
        .btn { display:inline-block; background:#7c3aed; color:#fff; padding:0.9rem 2rem; border-radius:50px; text-decoration:none; font-weight:700; transition:all 0.3s; }
        .btn:hover { background:#5b21b6; transform:translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-check-circle"></i></div>
        <h1>Payment Successful!</h1>
        <p>Your order has been confirmed. We'll contact you shortly to arrange delivery.</p>
        <div class="order-id">
            <strong id="orderInfo">Processing your order...</strong>
        </div>
        <a href="index.html" class="btn">
            <i class="fas fa-shopping-bag"></i> Continue Shopping
        </a>
    </div>
    <script>
        const params  = new URLSearchParams(window.location.search);
        const method  = params.get('method');
        const orderId = params.get('orderId') || params.get('oid');
        const pidx    = params.get('pidx');

        document.getElementById('orderInfo').textContent =
            `Order confirmed! Thank you for shopping with SneakPeak 🎉`;

        // Verify payment with backend
        if (method === 'khalti' && pidx) {
            fetch('http://localhost:3000/api/payment/khalti/verify', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ pidx, orderId })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    document.getElementById('orderInfo').textContent =
                        `Order #${d.order?.orderNumber} confirmed! ✅`;
                }
            });
        }
    </script>
</body>
</html>
