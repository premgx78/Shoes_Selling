<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed — SneakPeak</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'DM Sans',sans-serif; background:#f9fafb; display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .card { background:#fff; border-radius:20px; padding:3rem 2.5rem; max-width:440px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.1); }
        .icon { font-size:4rem; color:#f43f5e; margin-bottom:1.5rem; }
        h1 { font-family:'Syne',sans-serif; font-size:1.8rem; font-weight:800; color:#0f172a; margin-bottom:0.75rem; }
        p { color:#6b7280; line-height:1.6; margin-bottom:1.5rem; }
        .btn { display:inline-block; background:#7c3aed; color:#fff; padding:0.9rem 2rem; border-radius:50px; text-decoration:none; font-weight:700; transition:all 0.3s; margin:0.5rem; }
        .btn:hover { background:#5b21b6; }
        .btn-outline { background:transparent; border:2px solid #7c3aed; color:#7c3aed; }
        .btn-outline:hover { background:#7c3aed; color:#fff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-times-circle"></i></div>
        <h1>Payment Failed</h1>
        <p>Something went wrong with your payment. Please try again or choose a different payment method.</p>
        <a href="index.html" class="btn">Try Again</a>
        <a href="index.html" class="btn btn-outline">Go Home</a>
    </div>
</body>
</html>
